<!DOCTYPE html>
<html>
<head>
    <title>Doctor Dashboard</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #a5b4fc;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1e293b;
            --light: #f8fafc;
            --gray: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.9);
            --glass: rgba(255, 255, 255, 0.1);
            --shadow: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.05) 0%, transparent 50%);
            z-index: -1;
        }

        /* Floating Particles */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            z-index: -1;
        }

        /* Glassmorphism Container */
        .glass-container {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            overflow: hidden;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* Header with Gradient */
        .dashboard-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 32px 40px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 24px 24px 0 0;
            position: relative;
            overflow: hidden;
        }

        .dashboard-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            z-index: 2;
        }

        .doctor-icon-wrapper {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .header-text h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .header-text p {
            font-size: 16px;
            opacity: 0.9;
            font-weight: 300;
        }

        /* Logout Button - Neumorphic */
        .logout-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 14px 28px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 2;
            overflow: hidden;
        }

        .logout-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.7s;
        }

        .logout-btn:hover::before {
            left: 100%;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 10px 20px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.15);
        }

        .logout-btn:active {
            transform: translateY(0);
        }

        /* Search Section */
        .search-section {
            padding: 40px;
            background: var(--card-bg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .search-container {
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 18px 24px;
            padding-left: 56px;
            background: white;
            border: 2px solid transparent;
            border-radius: 16px;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 
                0 10px 20px rgba(99, 102, 241, 0.1),
                0 0 0 3px rgba(99, 102, 241, 0.1);
            transform: translateY(-1px);
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            font-size: 20px;
        }

        .load-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 18px 36px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
            position: relative;
            overflow: hidden;
        }

        .load-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .load-btn:hover::after {
            width: 300px;
            height: 300px;
        }

        .load-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.3);
        }

        /* Table Styling */
        .table-section {
            background: var(--card-bg);
            padding: 0;
        }

        .table-container {
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        thead {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 24px 20px;
            color: var(--dark);
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            border-bottom: 2px solid #e2e8f0;
            position: relative;
        }

        th::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20px;
            right: 20px;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        th:hover::after {
            transform: scaleX(1);
        }

        tbody tr {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        tbody tr:hover {
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.05), rgba(255, 255, 255, 0.8));
            transform: translateX(10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }

        td {
            padding: 24px 20px;
            text-align: center;
            font-weight: 500;
            color: var(--dark);
            position: relative;
        }

        /* Status Badges */
        .status-badge {
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            position: relative;
            overflow: hidden;
        }

        .status-badge::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent);
        }

        .status-confirmed {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .status-pending {
            background: linear-gradient(135deg, var(--warning), #d97706);
            color: white;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            min-width: 90px;
        }

        .confirm {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            box-shadow: 0 6px 12px rgba(16, 185, 129, 0.2);
        }

        .pending {
            background: linear-gradient(135deg, var(--warning), #d97706);
            color: white;
            box-shadow: 0 6px 12px rgba(245, 158, 11, 0.2);
        }

        .delete {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
            box-shadow: 0 6px 12px rgba(239, 68, 68, 0.2);
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .action-btn:hover::before {
            width: 200px;
            height: 200px;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }

        .action-btn:active {
            transform: translateY(-1px);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 40px;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 24px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 18px;
            color: var(--gray);
            margin-bottom: 32px;
        }

        /* Loading Animation */
        .loading {
            display: none;
            text-align: center;
            padding: 60px;
            background: var(--card-bg);
        }

        .loading.active {
            display: block;
        }

        .pulse-loader {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            position: relative;
        }

        .pulse-loader::before,
        .pulse-loader::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--primary), transparent);
            animation: pulse 1.5s linear infinite;
        }

        .pulse-loader::after {
            animation-delay: 0.75s;
        }

        @keyframes pulse {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* Footer */
        .dashboard-footer {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            padding: 24px 40px;
            text-align: center;
            color: var(--gray);
            font-size: 14px;
            border-radius: 0 0 24px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            body {
                padding: 20px;
            }
            
            .glass-container {
                margin: 0 10px;
            }
        }

        @media (max-width: 768px) {
            .dashboard-header {
                flex-direction: column;
                gap: 24px;
                text-align: center;
            }
            
            .header-content {
                flex-direction: column;
            }
            
            .search-container {
                flex-direction: column;
            }
            
            .table-container {
                overflow-x: auto;
            }
            
            table {
                min-width: 800px;
            }
            
            .action-buttons {
                flex-direction: column;
                align-items: center;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, var(--primary-dark), #4338ca);
        }
    </style>
</head>
<body>
    <!-- Floating Particles -->
    <div id="particles"></div>

    <!-- Main Container -->
    <div class="glass-container">
        <!-- Header -->
        <div class="dashboard-header">
            <div class="header-content">
                <div class="doctor-icon-wrapper">
                    <span></span>
                </div>
                <div class="header-text">
                    <h1>Doctor Dashboard</h1>
                    <p>Manage appointments with precision and care</p>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()">
                <span></span> Logout
            </button>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-container">
                <div class="input-wrapper">
                    <span class="search-icon"></span>
                    <input type="text" id="doctorId" placeholder="Enter your Doctor ID" class="search-input">
                </div>
                <button class="load-btn" onclick="loadData()">
                    Load Appointments
                </button>
            </div>
        </div>

        <!-- Loading Animation -->
        <div class="loading" id="loading">
            <div class="pulse-loader"></div>
            <p>Loading appointments...</p>
        </div>

        <!-- Table Section -->
        <div class="table-section">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Patient</th>
                            <th>Date & Time</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="data">
                        <tr class="empty-state">
                            <td colspan="5">
                                <div class="empty-icon"></div>
                                <p>Enter your Doctor ID to view appointments</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Footer -->
        <div class="dashboard-footer">
            <p>© 2024 Medical Dashboard v2.0 | Secure & Confidential</p>
        </div>
    </div>

<script>
// Create floating particles
function createParticles() {
    const container = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.top = `${Math.random() * 100}%`;
        particle.style.animation = `float ${3 + Math.random() * 4}s infinite ease-in-out`;
        particle.style.animationDelay = `${Math.random() * 5}s`;
        container.appendChild(particle);
    }
}

async function loadData() {
    const doctorId = document.getElementById("doctorId").value;
    if (!doctorId) {
        showNotification("Please enter your Doctor ID", "warning");
        return;
    }

    const loading = document.getElementById('loading');
    const tableBody = document.getElementById('data');
    
    loading.classList.add('active');
    tableBody.innerHTML = '';

    try {
        // Simulate API delay for demo
        await new Promise(resolve => setTimeout(resolve, 1500));
        
        const res = await fetch(`https://hospitalmanagmentproject-1-production-032c.up.railway.app/api/appoitment/doctor/${doctorId}`);
        const list = await res.json();

        if (list.length === 0) {
            tableBody.innerHTML = `
                <tr class="empty-state">
                    <td colspan="5">
                        <div class="empty-icon"></div>
                        <p>No appointments found for Doctor ID: ${doctorId}</p>
                    </td>
                </tr>`;
            showNotification("No appointments found", "info");
        } else {
            let rows = "";
            list.forEach(a => {
                const statusClass = a.status === 'CONFIRMED' ? 'status-confirmed' : 'status-pending';
                rows += `
                <tr>
                    <td><strong>#${a.id}</strong></td>
                    <td>
                        <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                            <div style="width: 36px; height: 36px; background: linear-gradient(135deg, #6366f1, #a5b4fc); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;">
                                ${a.fullname.charAt(0)}
                            </div>
                            ${a.fullname}
                        </div>
                    </td>
                    <td>
                        <div style="font-weight: 600; color: var(--dark);">${a.date}</div>
                        <div style="font-size: 12px; color: var(--gray);">${a.time}</div>
                    </td>
                    <td><span class="status-badge ${statusClass}">${a.status}</span></td>
                    <td>
                        <div class="action-buttons">
                            <button class="action-btn confirm" onclick="updateStatus(${a.id}, 'CONFIRMED')"> Confirm</button>
                            <button class="action-btn pending" onclick="updateStatus(${a.id}, 'PENDING')"> Pending</button>
                            <button class="action-btn delete" onclick="remove(${a.id})"> Delete</button>
                        </div>
                    </td>
                </tr>`;
            });
            tableBody.innerHTML = rows;
            showNotification(`Loaded ${list.length} appointments`, "success");
        }
    } catch (error) {
        tableBody.innerHTML = `
            <tr class="empty-state">
                <td colspan="5">
                    <div class="empty-icon">⚠️</div>
                    <p>Error loading appointments. Please try again.</p>
                </td>
            </tr>`;
        showNotification("Error loading data", "danger");
        console.error('Error:', error);
    } finally {
        loading.classList.remove('active');
    }
}

async function updateStatus(id, status) {
    if (!confirm(`Change appointment status to ${status}?`)) return;
    
    try {
        // Simulate API call
        await new Promise(resolve => setTimeout(resolve, 500));
        
        await fetch(`https://hospitalmanagmentproject-1-production-032c.up.railway.app/api/appoitment/${id}/status?status=${status}`, {
            method: "PATCH"
        });
        
        showNotification(`Status updated to ${status}`, "success");
        loadData();
    } catch (error) {
        showNotification("Error updating status", "danger");
        console.error('Error:', error);
    }
}

async function remove(id) {
    if (!confirm("Are you sure you want to delete this appointment?")) return;
    
    try {
        // Simulate API call
        await new Promise(resolve => setTimeout(resolve, 500));
        
        await fetch(`https://hospitalmanagmentproject-1-production-032c.up.railway.app/api/appoitment/${id}`, {
            method: "DELETE"
        });
        
        showNotification("Appointment deleted", "success");
        loadData();
    } catch (error) {
        showNotification("Error deleting appointment", "danger");
        console.error('Error:', error);
    }
}

function logout() {
    const btn = event.currentTarget;
    btn.innerHTML = '<span></span> Logging out...';
    btn.disabled = true;
    
    setTimeout(() => {
        showNotification("Logged out successfully", "success");
        // Redirect to login page
        window.location.href = "index.html";
    }, 1000);
}

function showNotification(message, type) {
    // Create notification element
    const notification = document.createElement('div');
    notification.style.cssText = `
        position: fixed;
        top: 30px;
        right: 30px;
        padding: 16px 24px;
        background: ${type === 'success' ? '#10b981' : type === 'warning' ? '#f59e0b' : '#ef4444'};
        color: white;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        z-index: 1000;
        animation: slideIn 0.3s ease;
        font-weight: 500;
    `;
    notification.textContent = message;
    document.body.appendChild(notification);
    
    setTimeout(() => {
        notification.style.animation = 'slideOut 0.3s ease';
        setTimeout(() => notification.remove(), 300);
    }, 3000);
}

// Add CSS for notification animations
const style = document.createElement('style');
style.textContent = `
    @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideOut {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(100%); opacity: 0; }
    }
`;
document.head.appendChild(style);

// Initialize particles on load
window.addEventListener('DOMContentLoaded', createParticles);
</script>

</body>

</html>
