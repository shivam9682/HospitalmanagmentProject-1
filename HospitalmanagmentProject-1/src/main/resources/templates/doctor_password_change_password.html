<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Hospital Management</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style th:inline="text">
        /* Custom CSS */
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --shadow: 0 8px 30px rgba(0,0,0,0.12);
            --transition: all 0.3s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .password-change-container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: var(--transition);
        }
        
        .password-change-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }
        
        .password-change-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
        }
        
        .logo {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .logo i {
            font-size: 28px;
        }
        
        .password-change-header h2 {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 28px;
        }
        
        .password-change-header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .password-change-body {
            padding: 40px;
        }
        
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark-color);
            font-size: 15px;
        }
        
        .input-group {
            position: relative;
        }
        
        .form-control {
            width: 100%;
            padding: 14px 45px 14px 15px;
            border: 2px solid #e1e5ee;
            border-radius: 10px;
            font-size: 16px;
            transition: var(--transition);
            background-color: #f8fafc;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6c757d;
            cursor: pointer;
            font-size: 18px;
            transition: var(--transition);
            z-index: 10;
        }
        
        .password-toggle:hover {
            color: var(--primary-color);
        }
        
        .password-strength {
            height: 5px;
            background-color: #e9ecef;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
            position: relative;
        }
        
        .password-strength-bar {
            height: 100%;
            width: 0;
            border-radius: 3px;
            transition: var(--transition);
        }
        
        .strength-weak { background-color: #dc3545; }
        .strength-fair { background-color: #ffc107; }
        .strength-good { background-color: #17a2b8; }
        .strength-strong { background-color: #28a745; }
        
        .password-requirements {
            margin-top: 10px;
            font-size: 13px;
            color: #6c757d;
        }
        
        .requirement {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .requirement i {
            margin-right: 8px;
            font-size: 12px;
        }
        
        .requirement.valid {
            color: var(--success-color);
        }
        
        .requirement.invalid {
            color: var(--danger-color);
        }
        
        .btn-change-password {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-change-password:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-change-password:active {
            transform: translateY(0);
        }
        
        .btn-change-password:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .back-to-login {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }
        
        .back-to-login a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }
        
        .back-to-login a:hover {
            text-decoration: underline;
        }
        
        .alert-message {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .alert-info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .password-change-container {
            animation: fadeIn 0.5s ease-out;
        }
        
        /* Responsive */
        @media (max-width: 576px) {
            .password-change-container {
                border-radius: 15px;
            }
            
            .password-change-header {
                padding: 25px 20px;
            }
            
            .password-change-body {
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="password-change-container">
        <div class="password-change-header">
            <div class="logo">
                <i class="fas fa-hospital-alt"></i>
                HOSPITAL MANAGEMENT
            </div>
            <h2>Change Password</h2>
            <p>Create a new secure password for your account</p>
        </div>
        
        <div class="password-change-body">
            <!-- Success/Error Messages -->
            <div th:if="${message}" class="alert-message" th:classappend="${success} ? 'alert-success' : 'alert-danger'">
                <i th:class="${success} ? 'fas fa-check-circle' : 'fas fa-exclamation-circle'"></i>
                <span th:text="${message}"></span>
            </div>
            
            <form id="changePasswordForm" th:action="@{/doctor-change-password}" method="post">
                <!-- CSRF Token (if using Spring Security) -->
                <!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /> -->
                
                <div class="form-group">
                    <label class="form-label" for="newPassword">
                        <i class="fas fa-lock"></i> New Password
                    </label>
                    <div class="input-group">
                        <input type="password" 
                               class="form-control" 
                               id="newPassword" 
                               name="newPassword"
                               placeholder="Enter new password"
                               required
                               minlength="8">
                        <button type="button" class="password-toggle" id="toggleNewPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="password-strength-bar" id="passwordStrengthBar"></div>
                    </div>
                    <div class="password-requirements" id="passwordRequirements">
                        <div class="requirement" id="reqLength">
                            <i class="fas fa-circle"></i> At least 8 characters
                        </div>
                        <div class="requirement" id="reqUppercase">
                            <i class="fas fa-circle"></i> At least one uppercase letter
                        </div>
                        <div class="requirement" id="reqLowercase">
                            <i class="fas fa-circle"></i> At least one lowercase letter
                        </div>
                        <div class="requirement" id="reqNumber">
                            <i class="fas fa-circle"></i> At least one number
                        </div>
                        <div class="requirement" id="reqSpecial">
                            <i class="fas fa-circle"></i> At least one special character
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">
                        <i class="fas fa-lock"></i> Confirm Password
                    </label>
                    <div class="input-group">
                        <input type="password" 
                               class="form-control" 
                               id="confirmPassword" 
                               name="confirmPassword"
                               placeholder="Re-enter new password"
                               required
                               minlength="8">
                        <button type="button" class="password-toggle" id="toggleConfirmPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div id="confirmPasswordMessage" style="font-size: 14px; margin-top: 5px;"></div>
                </div>
                
                <button type="submit" class="btn-change-password" id="submitBtn" disabled>
                    <i class="fas fa-key"></i>
                    <span id="btnText">Change Password</span>
                </button>
            </form>
            
            <div class="back-to-login">
                <a th:href="@{/login}">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </a>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            // Password visibility toggle
            const toggleNewPassword = document.getElementById('toggleNewPassword');
            const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
            const newPasswordInput = document.getElementById('newPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const passwordStrengthBar = document.getElementById('passwordStrengthBar');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const confirmPasswordMessage = document.getElementById('confirmPasswordMessage');
            
            // Password requirements elements
            const reqLength = document.getElementById('reqLength');
            const reqUppercase = document.getElementById('reqUppercase');
            const reqLowercase = document.getElementById('reqLowercase');
            const reqNumber = document.getElementById('reqNumber');
            const reqSpecial = document.getElementById('reqSpecial');
            
            let passwordValid = false;
            let confirmPasswordValid = false;
            
            // Toggle password visibility
            function togglePasswordVisibility(input, button) {
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                button.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
            }
            
            toggleNewPassword.addEventListener('click', function() {
                togglePasswordVisibility(newPasswordInput, this);
            });
            
            toggleConfirmPassword.addEventListener('click', function() {
                togglePasswordVisibility(confirmPasswordInput, this);
            });
            
            // Check password strength
            function checkPasswordStrength(password) {
                let strength = 0;
                let requirements = {
                    length: false,
                    uppercase: false,
                    lowercase: false,
                    number: false,
                    special: false
                };
                
                // Length requirement
                if (password.length >= 8) {
                    strength += 20;
                    requirements.length = true;
                    reqLength.classList.add('valid');
                    reqLength.classList.remove('invalid');
                    reqLength.innerHTML = '<i class="fas fa-check-circle"></i> At least 8 characters';
                } else {
                    reqLength.classList.add('invalid');
                    reqLength.classList.remove('valid');
                    reqLength.innerHTML = '<i class="fas fa-times-circle"></i> At least 8 characters';
                }
                
                // Uppercase requirement
                if (/[A-Z]/.test(password)) {
                    strength += 20;
                    requirements.uppercase = true;
                    reqUppercase.classList.add('valid');
                    reqUppercase.classList.remove('invalid');
                    reqUppercase.innerHTML = '<i class="fas fa-check-circle"></i> At least one uppercase letter';
                } else {
                    reqUppercase.classList.add('invalid');
                    reqUppercase.classList.remove('valid');
                    reqUppercase.innerHTML = '<i class="fas fa-times-circle"></i> At least one uppercase letter';
                }
                
                // Lowercase requirement
                if (/[a-z]/.test(password)) {
                    strength += 20;
                    requirements.lowercase = true;
                    reqLowercase.classList.add('valid');
                    reqLowercase.classList.remove('invalid');
                    reqLowercase.innerHTML = '<i class="fas fa-check-circle"></i> At least one lowercase letter';
                } else {
                    reqLowercase.classList.add('invalid');
                    reqLowercase.classList.remove('valid');
                    reqLowercase.innerHTML = '<i class="fas fa-times-circle"></i> At least one lowercase letter';
                }
                
                // Number requirement
                if (/[0-9]/.test(password)) {
                    strength += 20;
                    requirements.number = true;
                    reqNumber.classList.add('valid');
                    reqNumber.classList.remove('invalid');
                    reqNumber.innerHTML = '<i class="fas fa-check-circle"></i> At least one number';
                } else {
                    reqNumber.classList.add('invalid');
                    reqNumber.classList.remove('valid');
                    reqNumber.innerHTML = '<i class="fas fa-times-circle"></i> At least one number';
                }
                
                // Special character requirement
                if (/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password)) {
                    strength += 20;
                    requirements.special = true;
                    reqSpecial.classList.add('valid');
                    reqSpecial.classList.remove('invalid');
                    reqSpecial.innerHTML = '<i class="fas fa-check-circle"></i> At least one special character';
                } else {
                    reqSpecial.classList.add('invalid');
                    reqSpecial.classList.remove('valid');
                    reqSpecial.innerHTML = '<i class="fas fa-times-circle"></i> At least one special character';
                }
                
                // Update strength bar
                passwordStrengthBar.style.width = strength + '%';
                passwordStrengthBar.classList.remove('strength-weak', 'strength-fair', 'strength-good', 'strength-strong');
                
                if (strength <= 40) {
                    passwordStrengthBar.classList.add('strength-weak');
                } else if (strength <= 60) {
                    passwordStrengthBar.classList.add('strength-fair');
                } else if (strength <= 80) {
                    passwordStrengthBar.classList.add('strength-good');
                } else {
                    passwordStrengthBar.classList.add('strength-strong');
                }
                
                // Check if all requirements are met
                passwordValid = Object.values(requirements).every(val => val === true);
                updateSubmitButton();
                
                return strength;
            }
            
            // Check if passwords match
            function checkPasswordMatch() {
                const password = newPasswordInput.value;
                const confirmPassword = confirmPasswordInput.value;
                
                if (confirmPassword === '') {
                    confirmPasswordMessage.innerHTML = '';
                    confirmPasswordMessage.style.color = '';
                    confirmPasswordValid = false;
                } else if (password === confirmPassword) {
                    confirmPasswordMessage.innerHTML = '<i class="fas fa-check-circle"></i> Passwords match';
                    confirmPasswordMessage.style.color = 'var(--success-color)';
                    confirmPasswordValid = true;
                } else {
                    confirmPasswordMessage.innerHTML = '<i class="fas fa-times-circle"></i> Passwords do not match';
                    confirmPasswordMessage.style.color = 'var(--danger-color)';
                    confirmPasswordValid = false;
                }
                
                updateSubmitButton();
            }
            
            // Update submit button state
            function updateSubmitButton() {
                if (passwordValid && confirmPasswordValid) {
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                    btnText.innerHTML = 'Change Password';
                } else {
                    submitBtn.disabled = true;
                    submitBtn.style.opacity = '0.7';
                    btnText.innerHTML = 'Fill all requirements';
                }
            }
            
            // Event listeners
            newPasswordInput.addEventListener('input', function() {
                checkPasswordStrength(this.value);
                checkPasswordMatch();
            });
            
            confirmPasswordInput.addEventListener('input', checkPasswordMatch);
            
            // Form submission
            document.getElementById('changePasswordForm').addEventListener('submit', function(e) {
                if (!passwordValid || !confirmPasswordValid) {
                    e.preventDefault();
                    alert('Please fix all password requirements before submitting.');
                    return;
                }
                
                // Change button text to show loading
                submitBtn.disabled = true;
                btnText.innerHTML = 'Changing Password...';
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Changing Password...';
                
                // Form will submit normally after this
            });
            
            // Initialize
            checkPasswordStrength('');
            checkPasswordMatch();
        });
    </script>
</body>
</html>
