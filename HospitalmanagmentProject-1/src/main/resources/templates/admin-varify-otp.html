<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forgot Password</title>
 
     <style>
/* CSS Reset & Base Styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

/* Page Layout */
body {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* Main Container */
.container {
    background: #ffffff;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    border-radius: 16px;
    box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.1),
        0 5px 15px rgba(0, 0, 0, 0.1);
    text-align: center;
    position: relative;
}

/* Typography */
.container h2 {
    margin-bottom: 24px;
    color: #1a202c;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.5px;
}

.container label {
    display: block;
    text-align: left;
    margin-bottom: 8px;
    font-weight: 500;
    color: #4a5568;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* Form Elements */
.container input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 24px;
    border-radius: 8px;
    border: 2px solid #e2e8f0;
    outline: none;
    font-size: 16px;
    color: #2d3748;
    background: #f8fafc;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.container input[type="text"]:focus {
    border-color: #667eea;
    background: #ffffff;
    box-shadow: 
        0 0 0 4px rgba(102, 126, 234, 0.1),
        0 2px 8px rgba(102, 126, 234, 0.2);
    transform: translateY(-1px);
}

.container input[type="text"]::placeholder {
    color: #a0aec0;
    opacity: 0.8;
}

/* Button Styles */
.container button[type="submit"] {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #667eea 0%, #5a67d8 100%);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    letter-spacing: 0.5px;
    position: relative;
    overflow: hidden;
}

.container button[type="submit"]::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
    opacity: 0;
    transition: opacity 0.3s ease;
}

.container button[type="submit"]:hover {
    transform: translateY(-2px);
    box-shadow: 
        0 12px 24px rgba(102, 126, 234, 0.3),
        0 4px 12px rgba(102, 126, 234, 0.2);
}

.container button[type="submit"]:active {
    transform: translateY(0);
    box-shadow: 
        0 4px 8px rgba(102, 126, 234, 0.2),
        0 2px 4px rgba(102, 126, 234, 0.1);
}

/* Alert Styles */
.alert {
    padding: 16px;
    margin-bottom: 24px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.5;
    text-align: left;
    animation: slideIn 0.3s ease-out;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.alert-success {
    background: linear-gradient(135deg, #f0fff4 0%, #e6fffa 100%);
    color: #065f46;
    border: 1px solid #9ae6b4;
    border-left: 4px solid #38a169;
}

.alert-danger {
    background: linear-gradient(135deg, #fff5f5 0%, #fed7d7 100%);
    color: #c53030;
    border: 1px solid #fc8181;
    border-left: 4px solid #e53e3e;
}

/* Message Container */
.container .container {
    background: transparent;
    padding: 0;
    box-shadow: none;
    width: 100%;
    max-width: none;
}

.container .alert {
    margin: 0 0 16px 0;
}

/* Utility Classes */
.error {
    color: #e53e3e;
    margin-top: 12px;
    font-size: 14px;
    font-weight: 500;
    display: block;
    text-align: left;
}

.success {
    color: #38a169;
    margin-top: 12px;
    font-size: 14px;
    font-weight: 500;
    display: block;
    text-align: left;
}

/* Responsive Design */
@media (max-width: 480px) {
    .container {
        padding: 32px 24px;
        margin: 0 10px;
    }
    
    .container h2 {
        font-size: 22px;
        margin-bottom: 20px;
    }
    
    .container input[type="text"] {
        padding: 12px 14px;
        font-size: 15px;
    }
    
    .container button[type="submit"] {
        padding: 14px;
        font-size: 15px;
    }
    
    .alert {
        padding: 14px;
        font-size: 13px;
    }
}

/* Focus States for Accessibility */
.container input[type="text"]:focus-visible,
.container button[type="submit"]:focus-visible {
    outline: 2px solid #667eea;
    outline-offset: 2px;
}

/* Disabled State */
.container button[type="submit"]:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
}
</style>
     
     
    </head>
<body>

<div class="container">
     
      
     <div class="alert alert-success" role="alert">
       We have sent otp to your email 
</div>
 
     <div th:if="${session.message}" class="container">
      <div class="alert alert-danger my-2 text-center" role="alert" >
       <span th:text="${session.message}"></span>
      </div>
     </div>
  
    <form th:action="@{admin-varify}" method="post">
        <label>Email Otp</label>
        <input type="text" name="otp" placeholder="Enter your Otp" required>

        <button type="submit">Varify</button>
    </form>
         
          <form th:action="@{/rresend-otp}" method="post" style="margin-top:15px;">
    <button type="submit" style="
        background: transparent;
        border: none;
        color: #667eea;
        font-weight: 600;
        cursor: pointer;
        text-decoration: underline;
    ">
        Resend OTP
    </button>
</form>
          
    
</div>

</body>
</html>
